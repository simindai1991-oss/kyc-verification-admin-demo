<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPay MFB AD - KYC Verification</title>

    <!-- 依赖固定版本放在本地，外网 CDN 一次要拉 3.5MB，打开很慢 -->
    <script src="vendor/vue.global.prod.js"></script>
    <script src="vendor/tailwind-play-3.4.17.js"></script>
    <link rel="stylesheet" href="vendor/element-plus.css" />
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <script src="vendor/element-plus.full.min.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app" v-cloak class="flex h-screen">
        <side-menu></side-menu>

        <main class="flex-1 flex flex-col overflow-hidden bg-[#f4f5fa]">
            <div class="bg-yellow-100 border-b border-yellow-200 text-yellow-800 px-4 py-1.5 text-center text-xs font-bold flex justify-center items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>DEMO MODE: Mock data only. Customer List / My Customer List redesign for review.</span>
            </div>

            <top-bar></top-bar>

            <div class="tab-bar">
                <button v-for="t in tabs" :key="t.key" class="tab" :class="{ active: tab === t.key }" @click="tab = t.key">
                    {{ t.label }}
                </button>
            </div>

            <div class="flex-1 overflow-y-auto">
                <kyc-list v-if="tab === 'customerList'" key="all" mode="all"></kyc-list>
                <kyc-list v-else-if="tab === 'myCustomerList'" key="mine" mode="mine"></kyc-list>
                <div v-else class="m-6 bg-white rounded-lg p-16 text-center text-gray-400 text-sm">
                    <i class="fa-regular fa-file-lines text-3xl mb-3 block text-gray-300"></i>
                    This tab stays as it is online and is not part of this demo.
                </div>
            </div>
        </main>

        <debug-panel></debug-panel>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
